name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Package binaries
        run: |
          mkdir -p release
          npx pkg dist/index.js --targets node20-macos-arm64 --output release/eos-obs-bridge-macos-arm64
          npx pkg dist/index.js --targets node20-macos-x64 --output release/eos-obs-bridge-macos-x64
          ls -la release/

      # ── Code signing ────────────────────────────────────────────────────────

      - name: Import signing certificates
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          INSTALLER_P12: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          INSTALLER_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p ci-keychain-password build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-keychain-password build.keychain

          echo "$CERTIFICATE_P12" | base64 --decode > app-cert.p12
          security import app-cert.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm app-cert.p12

          echo "$INSTALLER_P12" | base64 --decode > installer-cert.p12
          security import installer-cert.p12 -k build.keychain \
            -P "$INSTALLER_PASSWORD" -T /usr/bin/pkgbuild -T /usr/bin/productsign
          rm installer-cert.p12

          security set-key-partition-list \
            -S apple-tool:,apple: -s -k ci-keychain-password build.keychain

      - name: Sign binaries
        env:
          DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          for ARCH in arm64 x64; do
            codesign \
              --sign "$DEVELOPER_ID" \
              --options runtime \
              --entitlements entitlements.plist \
              --timestamp \
              --force \
              --verbose \
              "release/eos-obs-bridge-macos-${ARCH}"
          done

      # ── Notarization ────────────────────────────────────────────────────────

      - name: Notarize binaries
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for ARCH in arm64 x64; do
            echo "Notarizing macos-${ARCH}..."
            zip -j "notarize-${ARCH}.zip" "release/eos-obs-bridge-macos-${ARCH}"
            xcrun notarytool submit "notarize-${ARCH}.zip" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait \
              --verbose
            rm "notarize-${ARCH}.zip"
          done

      # ── Build .pkg installers ────────────────────────────────────────────────

      - name: Build pkg installers
        env:
          INSTALLER_ID: ${{ secrets.APPLE_INSTALLER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ github.ref_name }}
        run: |
          for ARCH in arm64 x64; do
            PKG_ROOT="/tmp/pkg-root-${ARCH}"
            INSTALL_DIR="$PKG_ROOT/Applications/Eos OBS Bridge"
            mkdir -p "$INSTALL_DIR"

            cp "release/eos-obs-bridge-macos-${ARCH}" "$INSTALL_DIR/Eos OBS Bridge"
            chmod +x "$INSTALL_DIR/Eos OBS Bridge"
            cp overlay.html styles.css config.example.json "$INSTALL_DIR/"

            # Build unsigned package
            pkgbuild \
              --root "$PKG_ROOT" \
              --identifier "uk.tomdavislx.eos-obs-bridge" \
              --version "${VERSION#v}" \
              --install-location "/" \
              "release/eos-obs-bridge-${VERSION}-macos-${ARCH}-unsigned.pkg"

            # Sign with Developer ID Installer certificate
            productsign \
              --sign "$INSTALLER_ID" \
              "release/eos-obs-bridge-${VERSION}-macos-${ARCH}-unsigned.pkg" \
              "release/eos-obs-bridge-${VERSION}-macos-${ARCH}.pkg"

            rm "release/eos-obs-bridge-${VERSION}-macos-${ARCH}-unsigned.pkg"

            # Notarize the pkg
            xcrun notarytool submit "release/eos-obs-bridge-${VERSION}-macos-${ARCH}.pkg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait \
              --verbose

            # Staple notarization ticket to pkg (possible for .pkg unlike raw binaries)
            xcrun stapler staple "release/eos-obs-bridge-${VERSION}-macos-${ARCH}.pkg"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/eos-obs-bridge-*.pkg
          generate_release_notes: true
