name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Package binaries
        run: npx pkg dist/index.js --config package.json --compress GZip --output release/eos-obs-bridge

      # ── Code signing ────────────────────────────────────────────────────────

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p ci-keychain-password build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-keychain-password build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k ci-keychain-password build.keychain
          rm certificate.p12

      - name: Sign binaries
        env:
          DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          for ARCH in arm64 x64; do
            codesign \
              --sign "$DEVELOPER_ID" \
              --options runtime \
              --timestamp \
              --verbose \
              "release/eos-obs-bridge-macos-${ARCH}"
          done

      # ── Notarization ────────────────────────────────────────────────────────

      - name: Notarize binaries
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for ARCH in arm64 x64; do
            echo "Notarizing macos-${ARCH}..."
            zip -j "notarize-${ARCH}.zip" "release/eos-obs-bridge-macos-${ARCH}"
            xcrun notarytool submit "notarize-${ARCH}.zip" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait \
              --verbose
            rm "notarize-${ARCH}.zip"
          done

      # ── Package release archives ─────────────────────────────────────────────

      - name: Create release archives
        run: |
          VERSION="${{ github.ref_name }}"

          for ARCH in arm64 x64; do
            STAGING="/tmp/eos-obs-bridge-macos-${ARCH}"
            mkdir -p "$STAGING"

            cp "release/eos-obs-bridge-macos-${ARCH}" "$STAGING/eos-obs-bridge"
            chmod +x "$STAGING/eos-obs-bridge"

            cp overlay.html styles.css "$STAGING/"
            cp config.example.json "$STAGING/config.json"

            cd "$STAGING"
            zip -r "$GITHUB_WORKSPACE/eos-obs-bridge-${VERSION}-macos-${ARCH}.zip" .
            cd "$GITHUB_WORKSPACE"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: eos-obs-bridge-*.zip
          generate_release_notes: true
