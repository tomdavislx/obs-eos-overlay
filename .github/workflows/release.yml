name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Package binaries
        run: |
          mkdir -p release
          npx pkg dist/index.js --targets node20-macos-arm64 --output release/eos-obs-bridge-macos-arm64
          npx pkg dist/index.js --targets node20-macos-x64 --output release/eos-obs-bridge-macos-x64
          ls -la release/

      - name: Compile Swift menu bar app
        run: |
          swiftc macos-app/EosOBSBridge.swift \
            -framework Cocoa \
            -target arm64-apple-macos12.0 \
            -o release/EosOBSBridge-arm64
          swiftc macos-app/EosOBSBridge.swift \
            -framework Cocoa \
            -target x86_64-apple-macos12.0 \
            -o release/EosOBSBridge-x64

      # ── Code signing ────────────────────────────────────────────────────────

      - name: Import signing certificates
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          INSTALLER_P12: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          INSTALLER_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p ci-keychain-password build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-keychain-password build.keychain

          echo "$CERTIFICATE_P12" | base64 --decode > app-cert.p12
          security import app-cert.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm app-cert.p12

          echo "$INSTALLER_P12" | base64 --decode > installer-cert.p12
          security import installer-cert.p12 -k build.keychain \
            -P "$INSTALLER_PASSWORD" -T /usr/bin/pkgbuild -T /usr/bin/productsign
          rm installer-cert.p12

          security set-key-partition-list \
            -S apple-tool:,apple: -s -k ci-keychain-password build.keychain

      # ── Build, sign, notarize, and package .app + .pkg ───────────────────────

      - name: Build and sign .app bundles
        env:
          DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          INSTALLER_ID: ${{ secrets.APPLE_INSTALLER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION_NUM="${VERSION#v}"

          for ARCH in arm64 x64; do
            APP="release/Eos OBS Bridge.app"
            MACOS_DIR="$APP/Contents/MacOS"
            RES_DIR="$APP/Contents/Resources"

            # ── Assemble bundle ──────────────────────────────────────────────
            mkdir -p "$MACOS_DIR" "$RES_DIR"

            # Info.plist (substitute version number)
            sed "s/VERSION_PLACEHOLDER/$VERSION_NUM/g" macos-app/Info.plist \
              > "$APP/Contents/Info.plist"

            # Swift menu bar app → CFBundleExecutable
            cp "release/EosOBSBridge-${ARCH}" "$MACOS_DIR/Eos OBS Bridge"
            chmod +x "$MACOS_DIR/Eos OBS Bridge"

            # Server binary and overlay assets in Resources
            cp "release/eos-obs-bridge-macos-${ARCH}" "$RES_DIR/eos-obs-bridge"
            chmod +x "$RES_DIR/eos-obs-bridge"
            cp overlay.html styles.css config.example.json "$RES_DIR/"

            # ── Sign bundle ──────────────────────────────────────────────────
            # Sign the Node.js binary first (needs JIT entitlements for V8)
            codesign \
              --sign "$DEVELOPER_ID" \
              --options runtime \
              --entitlements entitlements.plist \
              --timestamp \
              --force \
              "$RES_DIR/eos-obs-bridge"

            # Sign the Swift binary (standard hardened runtime, no JIT needed)
            codesign \
              --sign "$DEVELOPER_ID" \
              --options runtime \
              --timestamp \
              --force \
              "$MACOS_DIR/Eos OBS Bridge"

            # Sign the bundle as a whole
            codesign \
              --sign "$DEVELOPER_ID" \
              --options runtime \
              --entitlements entitlements.plist \
              --timestamp \
              --force \
              --verbose \
              "$APP"

            # ── Notarize bundle ──────────────────────────────────────────────
            echo "Notarizing .app for ${ARCH}..."
            ditto -c -k --keepParent "$APP" "notarize-${ARCH}.zip"
            xcrun notarytool submit "notarize-${ARCH}.zip" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait \
              --verbose
            rm "notarize-${ARCH}.zip"

            # Staple notarization ticket to the .app
            xcrun stapler staple "$APP"

            # ── Build .pkg installer ─────────────────────────────────────────
            PKG_ROOT="/tmp/pkg-root-${ARCH}"
            mkdir -p "$PKG_ROOT/Applications"
            cp -R "$APP" "$PKG_ROOT/Applications/"

            pkgbuild \
              --root "$PKG_ROOT" \
              --identifier "uk.tomdavislx.eos-obs-bridge" \
              --version "$VERSION_NUM" \
              --install-location "/" \
              "release/Eos-OBS-Bridge-${VERSION}-macos-${ARCH}-unsigned.pkg"

            productsign \
              --sign "$INSTALLER_ID" \
              "release/Eos-OBS-Bridge-${VERSION}-macos-${ARCH}-unsigned.pkg" \
              "release/Eos-OBS-Bridge-${VERSION}-macos-${ARCH}.pkg"

            rm "release/Eos-OBS-Bridge-${VERSION}-macos-${ARCH}-unsigned.pkg"

            # Notarize and staple the .pkg
            xcrun notarytool submit "release/Eos-OBS-Bridge-${VERSION}-macos-${ARCH}.pkg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait \
              --verbose
            xcrun stapler staple "release/Eos-OBS-Bridge-${VERSION}-macos-${ARCH}.pkg"

            # Clean up .app for next iteration
            rm -rf "$APP"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Eos-OBS-Bridge-*.pkg
          generate_release_notes: true
