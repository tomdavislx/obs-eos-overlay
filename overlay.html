<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Eos Cue Overlay</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="overlay-root">
      <div id="status" class="on-air-text">Connecting...</div>
      <div id="main-cue" class="on-air-text">Waiting for cue...</div>
      <div id="running-cues"></div>
    </div>

    <script>
      const statusElement = document.getElementById("status");
      const mainCueElement = document.getElementById("main-cue");
      const runningCuesElement = document.getElementById("running-cues");
      /**
       * WebSocket URL for the bridge (same port as HTTP when page is served by the bridge).
       * OBS Browser Source: use http://127.0.0.1:8081/ (or your WEBSOCKET_PORT), not file:// —
       * embedded Chromium often blocks file:// → WebSocket.
       * Remote bridge: open http://<bridge-ip>:8081/ or file://…?bridgeHost=<ip>&bridgePort=8081
       */
      const qs = new URLSearchParams(window.location.search || "");
      function computeBridgeWsUrl() {
        const hostParam = qs.get("bridgeHost") || qs.get("wsHost");
        const portStr = qs.get("bridgePort") || qs.get("wsPort");
        const portNum =
          portStr != null && portStr !== ""
            ? Number(portStr) || 8081
            : null;

        if (hostParam) {
          const p = portNum ?? 8081;
          return `ws://${hostParam}:${p}`;
        }

        if (
          window.location.protocol === "http:" ||
          window.location.protocol === "https:"
        ) {
          const scheme =
            window.location.protocol === "https:" ? "wss:" : "ws:";
          return `${scheme}//${window.location.host}`;
        }

        const p = portNum ?? 8081;
        return `ws://127.0.0.1:${p}`;
      }
      const bridgeWsUrl = () => computeBridgeWsUrl();

      let activeCueElements = new Map(); // Track DOM elements for each cue
      let lastFlashedCue = null;
      let instantCueTimeout = null; // fallback if animationend never fires
      let instantPulseCleanup = null;
      let lastCueState = {}; // Track last state of each cue (for detecting transitions)

      function normalizeCueNumberKey(cueNumber) {
        if (cueNumber == null) return "";
        const n = Number(cueNumber);
        if (Number.isFinite(n)) return String(n);
        return String(cueNumber).trim();
      }

      function getCueStateKey(cue) {
        if (!cue || typeof cue !== "object") return "";
        const list = cue.cueList != null ? String(cue.cueList).trim() : "";
        const numberKey = normalizeCueNumberKey(cue.cueNumber);
        return `${list}/${numberKey}`;
      }

      function parseCuePercent(percentage) {
        if (!percentage || typeof percentage !== "string") return NaN;
        const n = parseInt(percentage.replace("%", ""), 10);
        return Number.isNaN(n) ? NaN : n;
      }

      function cueLooksRunning(cue) {
        if (cue.isStale) return false;
        if (cue.isRunning) return true;
        const p = parseCuePercent(cue.percentage);
        return !Number.isNaN(p) && p < 100;
      }

      function isInstantSnapCue(cue) {
        const p = parseCuePercent(cue.percentage);
        if (Number.isNaN(p) || p < 100) return false;
        const t = cue.time;
        return t === 0 || t == null;
      }

      function clearInstantPulseTimers() {
        if (instantCueTimeout) {
          clearTimeout(instantCueTimeout);
          instantCueTimeout = null;
        }
        if (instantPulseCleanup) {
          instantPulseCleanup();
          instantPulseCleanup = null;
        }
      }

      function sanitizeScene(scene) {
        if (typeof scene !== "string") return "";
        const trimmed = scene.trim();
        return trimmed.length > 0 ? trimmed : "";
      }

      function renderCueLines(targetElement, cue, options = {}) {
        if (!targetElement || !cue) return;
        const { prefix = "", includeScene = true } = options;
        targetElement.innerHTML = "";

        const scene = includeScene ? sanitizeScene(cue.scene) : "";
        if (scene) {
          const sceneEl = document.createElement("div");
          sceneEl.className = "cue-scene";
          sceneEl.textContent = scene;
          targetElement.appendChild(sceneEl);
        }

        const titleEl = document.createElement("div");
        titleEl.className = "cue-title";
        titleEl.textContent = `${prefix}${cue.cueNumber} - ${cue.label || ""}`.trim();
        targetElement.appendChild(titleEl);
      }

      function playInstantCuePulse(cueId, onSettled) {
        clearInstantPulseTimers();
        mainCueElement.classList.remove("cue-instant-pulse");
        void mainCueElement.offsetWidth;
        mainCueElement.className = "on-air-text cue-instant-pulse";

        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          if (instantCueTimeout) {
            clearTimeout(instantCueTimeout);
            instantCueTimeout = null;
          }
          mainCueElement.removeEventListener("animationend", onAnimEnd);
          instantPulseCleanup = null;
          if (lastFlashedCue === cueId) {
            mainCueElement.classList.remove("cue-instant-pulse");
            mainCueElement.className = "on-air-text cue-completed";
          }
          if (typeof onSettled === "function") onSettled();
        };

        const onAnimEnd = (e) => {
          if (e.animationName !== "instantCuePulse") return;
          finish();
        };
        mainCueElement.addEventListener("animationend", onAnimEnd);
        instantPulseCleanup = () => {
          mainCueElement.removeEventListener("animationend", onAnimEnd);
        };

        instantCueTimeout = setTimeout(finish, 800);
      }

      function updateStatus(status, message) {
        statusElement.className = status
          ? `on-air-text status-${status}`
          : "on-air-text";

        // Update text
        const statusText = {
          'connecting': 'Connecting...',
          'syncing': message || 'Syncing...',
          'connected': message || 'Connected',
          'reconnecting': message || 'Reconnecting...',
          'disconnected': message || 'Disconnected'
        };

        statusElement.textContent = statusText[status] || message || status;
      }

      function connect() {
        const wsUrl = bridgeWsUrl();
        console.log("Connecting to bridge WebSocket:", wsUrl);
        const ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          console.log("Connected to WebSocket bridge.");
          updateStatus("connecting", "Connected to server");
          if (mainCueElement.textContent === "Waiting for connection...") {
            mainCueElement.textContent = "Waiting for cue...";
          }
        };

        ws.onmessage = (event) => {
          let message;
          try {
            message = JSON.parse(event.data);
          } catch (e) {
            console.error("Overlay: bad JSON from bridge", e, event.data);
            return;
          }

          // Handle different message types
          if (message.type === 'CUE_UPDATE') {
            const data = message.data;
            const showSceneHeaders = data.showSceneHeaders !== false;
            if (data.latestCue) {
              updateMainCue(data.latestCue, showSceneHeaders);
              updateRunningCues(data.activeCues);
            }
            // If no active cues, leave the display as-is — the console is almost
            // certainly sitting on a completed cue that will arrive shortly.
          } else if (message.type === 'CONNECTION_STATUS') {
            // Update status display
            if (message.data.status) {
              updateStatus(message.data.status, message.data.message);
            }
          } else {
            // Legacy format (fallback)
            if (message.singleCue) {
              mainCueElement.textContent = message.singleCue.raw || "Error parsing cue";
            } else if (message.latestCue) {
              updateMainCue(message.latestCue);
              updateRunningCues(message.activeCues);
            }
          }
        };

        ws.onclose = (ev) => {
          console.warn("Overlay WebSocket closed:", ev.code, ev.reason || "", wsUrl);
          updateStatus("disconnected", "Retrying in 3s...");
          mainCueElement.textContent = "Waiting for connection...";
          runningCuesElement.innerHTML = "";
          activeCueElements.clear();
          setTimeout(connect, 3000);
        };

        ws.onerror = (err) => {
          console.error("WebSocket error:", err, wsUrl);
        };
      }

      function updateMainCue(latestCue, showSceneHeaders = true) {
        renderCueLines(mainCueElement, latestCue, { prefix: "LXQ: ", includeScene: showSceneHeaders });

        const cueStateKey = getCueStateKey(latestCue) || latestCue.cueId;
        const isNewCue = lastFlashedCue !== cueStateKey;
        const lastState = lastCueState[cueStateKey] || {};

        const justCompletedInstantly =
          isInstantSnapCue(latestCue) &&
          lastState.percentage !== "100%" &&
          latestCue.percentage === "100%";

        lastCueState[cueStateKey] = {
          percentage: latestCue.percentage,
          isRunning: latestCue.isRunning,
        };

        const pulsePlaying = mainCueElement.classList.contains("cue-instant-pulse");

        if (isNewCue) {
          clearInstantPulseTimers();
          lastFlashedCue = cueStateKey;

          if (latestCue.isStale) {
            mainCueElement.className = "on-air-text cue-stale";
          } else if (cueLooksRunning(latestCue)) {
            mainCueElement.className = "on-air-text cue-running";
          } else {
            mainCueElement.className = "on-air-text cue-completed";
          }
        } else if (justCompletedInstantly) {
          clearInstantPulseTimers();
          playInstantCuePulse(cueStateKey);
        } else if (!pulsePlaying) {
          if (latestCue.isStale) {
            mainCueElement.className = "on-air-text cue-stale";
          } else if (cueLooksRunning(latestCue)) {
            mainCueElement.className = "on-air-text cue-running";
          } else {
            mainCueElement.className = "on-air-text cue-completed";
          }
        }
      }

      function updateRunningCues(activeCues) {
        // Skip the first cue (it's shown in main display)
        const runningCues = activeCues.slice(1);
        
        // Remove elements for cues no longer active
        for (const [cueId, element] of activeCueElements) {
          if (!activeCues.find(cue => cue.cueId === cueId)) {
            if (element.parentNode) {
              element.parentNode.removeChild(element);
            }
            activeCueElements.delete(cueId);
          }
        }
        
        // Update or create elements for running cues
        runningCues.forEach(cue => {
          let element = activeCueElements.get(cue.cueId);
          
          if (!element) {
            // Create new element
            element = document.createElement('div');
            element.className = 'cue-item on-air-text cue-running';
            runningCuesElement.appendChild(element);
            activeCueElements.set(cue.cueId, element);
          }
          
          // Update content and status
          renderCueLines(element, cue, { prefix: "LXQ: ", includeScene: false });
          
          if (cue.isStale) {
            element.className = "cue-item on-air-text cue-stale";
          } else if (cueLooksRunning(cue)) {
            element.className = "cue-item on-air-text cue-running";
          } else {
            element.className = "cue-item on-air-text cue-completed";
          }
        });
      }

      connect();
    </script>
  </body>
</html>
